name: Daily job feed update

# 07:00 UTC = 2 AM Central (daylight time) / 1 AM Central (standard time).
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: postings-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect postings from the last 24 hours
        run: python collector/collect.py
      - name: Commit updated data
        run: |
          git config user.name "job-openings-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/postings.json
          git diff --cached --quiet && exit 0
          git commit -m "Daily postings update $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
